<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/kinodex-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/kinodex-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Movie Collection Assistant | Kinodex</title>
    <script>
      // The theme chosen in Settings, applied before the page draws so it doesn't flash dark
      // first. Dark (the class above) unless Light, or System on a light system, was chosen.
      // Keep in step with src/utils/theme.ts.
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || (theme === "system" && !matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
